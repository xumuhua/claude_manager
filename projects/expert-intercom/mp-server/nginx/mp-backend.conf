# mp-backend Nginx 反代 + SSL 模板
# 用法：域名到位后，全文将 {{DOMAIN}} 替换为备案域名（如 intercom.example.com），
#       {{SSL_CERT}} / {{SSL_KEY}} 替换为证书路径，放入 /etc/nginx/sites-available/ 并启用。
# 微信小程序合法域名配置：request 合法域名 + socket 合法域名均填 https://{{DOMAIN}} / wss://{{DOMAIN}}

server {
    listen 80;
    server_name {{DOMAIN}};
    # ACME 验证（certbot 申请证书时放开）；平时跳转 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name {{DOMAIN}};

    ssl_certificate     {{SSL_CERT}};    # 例：/etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem
    ssl_certificate_key {{SSL_KEY}};     # 例：/etc/letsencrypt/live/{{DOMAIN}}/privkey.pem
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2m;

    # WS 推送通道（必须带 Upgrade 头 + 长读超时）
    location /ws {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # 长连接：1 小时无帧不断（服务端 heartbeat=30s 保活）
        proxy_send_timeout 60s;
    }

    # HTTP API（对话 + GitHub 代理）
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
